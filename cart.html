<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="css/main.css">
    <link rel="stylesheet" href="css/cart.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css" 
      crossorigin="anonymous" referrerpolicy="no-referrer" />
    <title>Cart - Coffee Shop</title>
</head>
<body>
    <!-- Fixed Navbar -->
    <header class="navbar">
        <div class="logo">
            <img src="./images/icons8-coffee-64.png" alt="Coffee Shop Logo">
        </div>
        <button id="theme-toggle" class="theme-toggle" aria-label="Toggle theme">
            <span id="theme-icon">☀️</span>
        </button>
    </header>

    <!-- Cart Content -->
    <main class="cart-content">
        <h1>Your Cart</h1>
        <div class="cart-items">
            <div class="cart-item">
                <img src="./images/vecteezy_espresso-coffee-isolated-illustration_23434641.jpg" alt="Espresso" class="cart-item-image">
                <div class="cart-item-info">
                    <h3 class="cart-item-name">Espresso</h3>
                    <p class="cart-item-price">$4.99</p>
                    <div class="quantity-selector">
                        <button class="decrease-quantity">-</button>
                        <span class="quantity">1</span>
                        <button class="increase-quantity">+</button>
                    </div>
                </div>
                <span class="delete-icon"><i class="fas fa-trash"></i></span>
            </div>
            <div class="cart-item">
                <img src="./images/vecteezy_espresso-coffee-isolated-illustration_23434641.jpg" alt="Espresso" class="cart-item-image">
                <div class="cart-item-info">
                    <h3 class="cart-item-name">Espresso</h3>
                    <p class="cart-item-price">$4.99</p>
                    <div class="quantity-selector">
                        <button class="decrease-quantity">-</button>
                        <span class="quantity">1</span>
                        <button class="increase-quantity">+</button>
                    </div>
                </div>
                <span class="delete-icon"><i class="fas fa-trash"></i></span>
            </div>
            <div class="cart-item">
                <img src="./images/vecteezy_espresso-coffee-isolated-illustration_23434641.jpg" alt="Espresso" class="cart-item-image">
                <div class="cart-item-info">
                    <h3 class="cart-item-name">Espresso</h3>
                    <p class="cart-item-price">$4.99</p>
                    <div class="quantity-selector">
                        <button class="decrease-quantity">-</button>
                        <span class="quantity">1</span>
                        <button class="increase-quantity">+</button>
                    </div>
                </div>
                <span class="delete-icon"><i class="fas fa-trash"></i></span>
            </div>
            <div class="cart-item">
                <img src="./images/vecteezy_espresso-coffee-isolated-illustration_23434641.jpg" alt="Espresso" class="cart-item-image">
                <div class="cart-item-info">
                    <h3 class="cart-item-name">Espresso</h3>
                    <p class="cart-item-price">$4.99</p>
                    <div class="quantity-selector">
                        <button class="decrease-quantity">-</button>
                        <span class="quantity">1</span>
                        <button class="increase-quantity">+</button>
                    </div>
                </div>
                <span class="delete-icon"><i class="fas fa-trash"></i></span>
            </div>
        </div>
        <button class="checkout-btn">Checkout</button>
        <!-- Custom Alert Modal -->
        <div id="custom-alert" class="custom-alert hidden">
            <div class="alert-box">
                <h2 id="alert-title">Alert Title</h2>
                <p id="alert-message">This is the alert message.</p>
                <button id="alert-close-btn" class="alert-close-btn">Close</button>
            </div>
        </div>
    </main>

    <!-- Fixed Footer -->
    <footer class="footer">
        <a href="index.html" class="footer-btn" id="home-btn" aria-label="Home">
            <img src="./images/icons8-home-64.png" alt="Home">
        </a>
        <a href="cart.html" class="footer-btn" id="cart-btn" aria-label="Cart">
            <img src="./images/icons8-cart-64.png" alt="Cart">
        </a>
        <a href="categories.html" class="footer-btn" id="categories-btn" aria-label="Categories">
            <img src="./images/icons8-grid-64.png" alt="Categories">
        </a>
        <a href="discounts.html" class="footer-btn" id="discounts-btn" aria-label="Discounts">
            <img src="./images/icons8-discount-64.png" alt="Discounts">
        </a>
    </footer>

    <script src="js/app.js"></script>
    <script src="js/cart.js"></script>
</body>
</html>
