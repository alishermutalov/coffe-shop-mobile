<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="css/main.css">
    <link rel="stylesheet" href="css/discounts.css">
    <title>Discounts - Coffee Shop</title>
</head>
<body>
    <!-- Fixed Navbar -->
    <header class="navbar">
        <div class="logo">
            <img src="./images/icons8-coffee-64.png" alt="Coffee Shop Logo">
        </div>
        <button id="theme-toggle" class="theme-toggle" aria-label="Toggle theme">
            <span id="theme-icon">☀️</span>
        </button>
    </header>

    <!-- Discounts Content -->
    <main class="discounts-content">
        <h1>Special Discounts</h1>
        <section class="discount-cards">
            <div class="discount-card">
                <img src="./images/4223647.jpg" alt="Banner 1">
                <p>Get 20% off on all Espresso orders this week!</p>
            </div>
            <div class="discount-card">
                <img src="./images/5979292.jpg" alt="Banner 2">
                <p>Buy one Cappuccino, get one free!</p>
            </div>
            <div class="discount-card">
                <img src="./images/9669849.jpg" alt="Banner 3">
                <p>Exclusive Latte deals: Save $2 on every order.</p>
            </div>
        </section>
        <!-- Custom Alert Modal -->
        <div id="custom-alert" class="custom-alert hidden">
            <div class="alert-box">
                <h2 id="alert-title">Alert Title</h2>
                <p id="alert-message">This is the alert message.</p>
                <button id="alert-close-btn" class="alert-close-btn">Close</button>
            </div>
        </div>
    </main>

    <!-- Fixed Footer -->
    <footer class="footer">
        <a href="index.html" class="footer-btn" id="home-btn" aria-label="Home">
            <img src="./images/icons8-home-64.png" alt="Home">
        </a>
        <a href="cart.html" class="footer-btn" id="cart-btn" aria-label="Cart">
            <img src="./images/icons8-cart-64.png" alt="Cart">
        </a>
        <a href="categories.html" class="footer-btn" id="categories-btn" aria-label="Categories">
            <img src="./images/icons8-grid-64.png" alt="Categories">
        </a>
        <a href="discounts.html" class="footer-btn" id="discounts-btn" aria-label="Discounts">
            <img src="./images/icons8-discount-64.png" alt="Discounts">
        </a>
    </footer>

    <script src="js/app.js"></script>
    <script src="js/discounts.js"></script>
</body>
</html>
